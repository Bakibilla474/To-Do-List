<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple browser-based to-do list." />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="todo-app" aria-labelledby="page-title">
        <h1 id="page-title">To-Do List <img src="images/icon.png" alt="" /></h1>
        <form class="row" id="task-form">
          <label class="visually-hidden" for="input-box">New task</label>
          <input
            type="text"
            id="input-box"
            name="task"
            placeholder="What needs to get done?"
            maxlength="120"
            autocomplete="off"
            required
          />
          <button type="submit">Add task</button>
        </form>
        <ul id="list-container" aria-label="Tasks"></ul>
      </section>
    </main>
  </body>
</html>
